spring:
  application:
    name: global-page-generator

  # ── PostgreSQL DataSource ───────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:global_page_generator}
    username: ${DB_USERNAME:gpg_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

    # HikariCP — sized to safely handle upstream API calls without connection exhaustion.
    # Max 10 connections × 30 s read-timeout = 300 s maximum concurrent I/O exposure.
    hikari:
      pool-name: GpgHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000       # ms — time to wait for a connection from pool
      idle-timeout: 600000            # ms — 10 min before idle connection is retired
      max-lifetime: 1800000           # ms — 30 min hard limit per connection
      keepalive-time: 60000           # ms — 1 min heartbeat to prevent firewall drops
      connection-test-query: SELECT 1

  # ── Redis (cache backend) ──────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 1

  # ── JPA / Hibernate ────────────────────────────────────────────────────────
  jpa:
    open-in-view: false               # Disable OSIV — all access within explicit @Transactional
    hibernate:
      ddl-auto: validate              # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # JSONB columns are written as text and cast to ::jsonb via @ColumnTransformer.
        # jdbc.lob.non_contextual_creation suppresses a JDBC LOB warning on PG driver.
        jdbc:
          lob:
            non_contextual_creation: true
        # Disable the second-level cache — we rely on application-level caching if needed
        cache:
          use_second_level_cache: false

  # ── Flyway ──────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ── Security (stateless JWT — no sessions) ──────────────────────────────────
  security:
    token:
      header: Authorization
      prefix: "Bearer "

# ── Server ──────────────────────────────────────────────────────────────────
server:
  port: 8080
  error:
    include-message: never           # Never expose internal messages in error responses
    include-stacktrace: never

# ── Application cache namespaces ─────────────────────────────────────────────
# TTLs (in ms) are read by CacheConfig — kept here so ops can tune per-env
# without touching code.
app:
  cache:
    layout-ttl-ms: 300000             # 5 minutes — layout config changes rarely
  rest-client:
    connect-timeout-ms: 5000         # 5 s — TCP handshake limit
    read-timeout-ms: 30000           # 30 s — max time waiting for first upstream byte

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.globalpagegenerator: DEBUG
    org.springframework.security: INFO
    org.springframework.web.client: DEBUG
    com.zaxxer.hikari: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"